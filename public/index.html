<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Repack</title><style>body{font:16px system-ui;background:#0a1123;color:#e9efff;margin:0}main{max-width:800px;margin:50px auto;padding:20px}.card{background:#17233e;border:1px solid #33446c;padding:28px;border-radius:20px;margin:20px 0}h1{font-size:36px}p{color:#b1bfd9}input,button{font:inherit;padding:12px;border-radius:10px}input{background:#0a1123;color:white;border:1px solid #64748b;max-width:100%}button{background:#3984ff;border:0;color:white;cursor:pointer;margin:6px}button:disabled{opacity:.5}.hide{display:none}.modes{display:flex;flex-wrap:wrap}.selected{outline:3px solid #9ec5ff}progress{width:100%}</style><main><h2>CODEX <span style="color:#73b5ff">REPACK</span></h2><section id="login" class="card"><h1>Video Repack Studio</h1><p>Masukkan kode akses admin. Tidak ada timer.</p><form id="form"><input id="code" placeholder="Kode akses" required><button>Masuk</button></form><p id="error"></p></section><section id="studio" class="card hide"><h1>Proses Video</h1><p>Pilih mode pemrosesan. HDR Look adalah penyesuaian warna, bukan HDR10 asli.</p><div class="modes"><button class="selected" data-mode="hd">Repack HD</button><button data-mode="fps">120 FPS</button><button data-mode="hdr">HDR Look</button></div><p>Upload beberapa video (maksimal 500 MB per file).</p><input id="files" type="file" accept="video/*,.mkv" multiple><p><button id="go">Proses & Download</button><button id="out">Keluar</button></p><progress id="progress" value="0" max="100"></progress><p id="status">Siap.</p></section></main><script>
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('codex_token')||'',mode='hd';function show(){ $('login').classList.toggle('hide',!!token);$('studio').classList.toggle('hide',!token)}show();
if(token)fetch('/api/session',{headers:{Authorization:'Bearer '+token}}).then(r=>{if(!r.ok){token='';sessionStorage.removeItem('codex_token');show()}});
$('form').onsubmit=async e=>{e.preventDefault();try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('code').value})}),d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;sessionStorage.setItem('codex_token',token);show()}catch(e){$('error').textContent=e.message}};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');mode=b.dataset.mode});
$('out').onclick=()=>{token='';sessionStorage.removeItem('codex_token');show()};
$('go').onclick=async()=>{const files=[...$('files').files];if(!files.length)return $('status').textContent='Pilih video dulu';$('go').disabled=true;let n=0;for(const f of files){$('status').textContent='Memproses '+f.name+' ('+(n+1)+'/'+files.length+')';try{let fd=new FormData();fd.append('video',f);fd.append('mode',mode);let r=await fetch('/api/process',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});if(!r.ok){let d=await r.json().catch(()=>({}));throw Error(d.error||'Gagal proses')}let blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=f.name.replace(/\.[^.]+$/,'')+'-'+mode+'.mp4';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){$('status').textContent='Gagal '+f.name+': '+e.message;break}n++;$('progress').value=n/files.length*100}$('go').disabled=false;if(n===files.length)$('status').textContent='Selesai. '+n+' video diproses.'};
</script></html>
